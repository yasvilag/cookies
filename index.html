<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>✅ Minhas Tarefas</h1>
            <button id="themeToggle" class="theme-button">
                <span class="icon">🌙</span>
            </button>
        </div>
    </header>

    <main>
        <div class="container">
            <!-- Input para adicionar tarefa -->
            <div class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Adicione uma nova tarefa..."
                        class="task-input"
                    >
                    <button id="addTaskBtn" class="btn-primary">
                        <span>➕</span> Adicionar
                    </button>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Ativas</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>

            <!-- Lista de tarefas -->
            <div class="tasks-container">
                <div id="tasksList" class="tasks-list">
                    <!-- Tarefas serão adicionadas aqui pelo JavaScript -->
                </div>
                
                <!-- Mensagem quando vazio -->
                <div id="emptyState" class="empty-state">
                    <p>📝 Nenhuma tarefa por aqui!</p>
                    <small>Adicione uma tarefa para começar</small>
                </div>
            </div>

            <!-- Resumo de tarefas -->
            <div class="tasks-summary">
                <span id="taskCount">0 tarefas</span>
                <button id="clearCompleted" class="btn-danger">🗑️ Limpar Concluídas</button>
            </div>
        </div>
    </main>

    <footer>
        <p>💾 Suas tarefas são salvas automaticamente com cookies</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
